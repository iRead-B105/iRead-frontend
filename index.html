<!doctype html>
<html lang="ko">
  <head>
    <!-- head에는 화면 본문이 아니라 브라우저와 검색 도구에 전달할 문서 정보가 들어갑니다. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="아이마다 다른 읽기의 속도를 함께 찾아가는 개인화 읽기 학습 서비스 iRead"
    />
    <meta name="theme-color" content="#fffaf0" />
    <meta property="og:title" content="iRead | 아이마다 다른 읽기의 속도" />
    <meta
      property="og:description"
      content="아동에게는 즐거운 읽기 연습을, 교수자에게는 성장을 이해하는 근거를 제공합니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/landing-reading-journey.png" />
    <title>iRead | 아이마다 다른 읽기의 속도</title>
  </head>
  <body>
    <!-- 아래 빈 app 요소에 Vue가 화면 전체를 동적으로 그려 넣습니다. -->
    <div id="app"></div>
    <!-- type="module"은 import/export를 쓰는 최신 방식으로 main.ts를 실행한다는 뜻입니다. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
