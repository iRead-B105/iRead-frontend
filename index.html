<!DOCTYPE html>
<html lang="">
  <head>
    <!-- head에는 화면 본문이 아니라 브라우저와 검색 도구에 전달할 문서 정보가 들어갑니다. -->
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iRead 교수자용 학습 관리 UI 목업" />
    <title>iRead 교수자 관리</title>
  </head>
  <body>
    <!-- 아래 빈 app 요소에 Vue가 화면 전체를 동적으로 그려 넣습니다. -->
    <div id="app"></div>
    <!-- type="module"은 import/export를 쓰는 최신 방식으로 main.ts를 실행한다는 뜻입니다. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
